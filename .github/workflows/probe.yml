name: probe runner
on:
  push:
    branches: [research/walk-timing]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers; uname -a
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          df -h; df -i /
          diskutil apfs list | head -60
          mount
          go version || true
          ls -la $RUNNER_TEMP
          df -h $RUNNER_TEMP $HOME /tmp
