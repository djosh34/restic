name: walk timing
on:
  push:
    branches: [research/walk-timing]
    paths: [.github/workflows/walk-timing.yml, bench/walk/**]
jobs:
  bench:
    name: ${{ matrix.variant }} ${{ matrix.files }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: default, files: 50000 }
          - { variant: no-cache, files: 50000 }
          - { variant: no-scan, files: 50000 }
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: bench/walk/run.sh
        env:
          VARIANT: ${{ matrix.variant }}
          FILES: ${{ matrix.files }}
          RESTIC_VERSION: 0.19.1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.variant }}-${{ matrix.files }}
          path: results/
          retention-days: 3
